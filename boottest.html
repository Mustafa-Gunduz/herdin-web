<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a6e3b0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Herd-In!</title>
  <link rel="icon" href="icon.png">
  <meta name="description" content="Herd-In! – a calm sheepdog puzzle. Guide the flock into the pen without letting any sheep slip off the field.">
  <style>
    /* Herd-In! web sürümü: telefonda tam ekran, bilgisayarda telefon oranında ortalanmış oyun alanı. */
    html, body { margin: 0; height: 100%; background: #a6e3b0; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: relative; height: 100%; height: 100dvh; aspect-ratio: 390 / 844; max-width: 100vw; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #a6e3b0; touch-action: none; outline: none; }
    body.mobile #stage { width: 100vw; height: 100%; height: 100dvh; aspect-ratio: auto; }
    /* Açılış: güneş tepenin ardından doğar, koyun ve köpek aşağıdan koşup yazıya atlar, güneş Funday Morning logosuna dönüşür. */
    #loading { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(#b7a6e8, #ffb8a0 58%, #ffd9a8); transition: opacity .45s ease; }
    #loading > * { position: absolute; }
    #day { inset: 0; background: linear-gradient(#8fd0f7, #cdeffb 52%, #fff1dd); opacity: 0; }
    #hills { left: 0; width: 100%; bottom: 0; height: 42%; }
    #loading img { display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    #sun, #title, #logo, .ch { left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity; }
    #title, #logo, .ch, #fm, #barbox, #flash { opacity: 0; }
    #fm { border-radius: 50%; box-shadow: 0 0 0 4px #fff8f0, 0 6px 18px rgba(59, 47, 74, .25); }
    #flash { border-radius: 50%; background: radial-gradient(#fffbe8 0%, rgba(255, 230, 140, .7) 35%, rgba(255, 220, 120, 0) 70%); }
    .dust { width: 14px; height: 14px; border-radius: 50%; background: #fff8f0; opacity: .9; }
    #barbox { left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(60%, 240px); }
    #bar { width: 100%; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .55); box-shadow: inset 0 1px 2px rgba(59, 47, 74, .15); overflow: hidden; }
    #fill { width: 0; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #ff7f86, #ffbe3d, #5cc48a, #5faeff); }
    #note { color: #3f7a55; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    #error { display: none; left: 50%; top: 80%; transform: translateX(-50%); width: 280px; max-width: 300px; color: #3b2f4a; text-align: center; font-size: 15px; line-height: 1.5; padding: 0 16px; }
    #halt { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; background: rgba(59, 47, 74, .55); }
    #halt div { max-width: 300px; margin: 0 20px; padding: 22px 20px; border-radius: 22px; background: #fff8f0; color: #3b2f4a; text-align: center; font-size: 16px; line-height: 1.45; }
    #halt button { margin-top: 14px; padding: 12px 26px; border: 0; border-radius: 16px; background: #6cc56b; color: #fff; font: 800 17px system-ui, sans-serif; }
    #halt small { display: block; margin-top: 12px; color: #7a6e86; font-size: 11px; word-break: break-word; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="day"></div>
      <img id="sun" src="boot/sun.png" alt="">
      <svg id="hills" viewBox="0 0 390 360" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 120 C 90 40 190 70 260 110 C 320 140 360 120 390 100 V360 H0 Z" fill="#8fd3a0"/>
        <path d="M0 170 C 80 110 170 100 230 130 C 300 165 350 150 390 140 V360 H0 Z" fill="#a6e3b0"/>
        <path d="M0 170 C 80 110 170 100 230 130 C 300 165 350 150 390 140" fill="none" stroke="#c4f0cb" stroke-width="5" stroke-linecap="round"/>
        <g fill="#fffdf8"><circle cx="48" cy="200" r="3"/><circle cx="120" cy="170" r="2.5"/><circle cx="300" cy="190" r="3"/><circle cx="350" cy="230" r="2.5"/><circle cx="200" cy="250" r="3"/><circle cx="80" cy="290" r="2.5"/><circle cx="260" cy="300" r="3"/></g>
      </svg>
      <div id="flash"></div>
      <img id="fm" src="funday-morning.jpg" alt="Funday Morning Games">
      <img class="ch" id="sheep" src="boot/sheep_run.png" alt="">
      <img class="ch" id="dog" src="boot/dog_run.png" alt="">
      <img id="title" src="boot/title.png" alt="">
      <img id="logo" src="logo.png" alt="Herd-In!">
      <div id="barbox"><div id="bar"><div id="fill"></div></div><div id="note"></div></div>
      <div id="error"></div>
    </div>
  </div>
  <div id="halt"><div><span id="halt-msg"></span><br><button id="halt-btn"></button><small id="halt-why"></small></div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    // Oyun döngüsü bekçisi: Unity her karede requestAnimationFrame çağırır; çağrılar durursa oyun takılmıştır.
    var lastFrame = Date.now(), lastError = "";
    var raf = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = function (cb) { return raf(function (t) { lastFrame = Date.now(); cb(t); }); };
    window.addEventListener("error", function (e) { lastError = String(e.message || e).slice(0, 300); });
    window.addEventListener("unhandledrejection", function (e) { lastError = String(e.reason && (e.reason.message || e.reason)).slice(0, 300); });
    var tr = (navigator.language || "").toLowerCase().indexOf("tr") === 0;
    document.querySelector("#note").textContent = tr ? "Yükleniyor…" : "Loading…";
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (mobile) document.body.classList.add("mobile");

    // ---- açılış animasyonu (yaklaşık 2,8 sn) + en az 1,2 sn yükleme çubuğu ----
    var boot = (function () {
      var $ = function (id) { return document.getElementById(id); };
      var L = $("loading"), sun = $("sun"), day = $("day"), title = $("title"), logo = $("logo"), fm = $("fm"), flash = $("flash");
      var sheep = $("sheep"), dog = $("dog"), barbox = $("barbox"), fill = $("fill");
      var q = new URLSearchParams(location.search);
      var hold = q.has("boot") ? parseFloat(q.get("boot")) * 1000 : -1;   // test: animasyonu bu anda dondur
      var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var ANIM = 2800, BAR = 1200;
      var t0 = performance.now(), real = 0, ready = null, shown = 0, done = false;
      var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
      var seg = function (t, a, b) { return clamp((t - a) / (b - a)); };
      var out3 = function (k) { return 1 - Math.pow(1 - k, 3); };
      var back = function (k) { var s = 1.7; k -= 1; return 1 + k * k * ((s + 1) * k + s); };
      var lerp = function (a, b, k) { return a + (b - a) * k; };
      function put(el, x, y, w, h, sc, rot, op) {
        el.style.width = w + "px"; el.style.height = h + "px";
        el.style.transform = "translate(" + (x - w / 2) + "px," + (y - h / 2) + "px) scale(" + sc + ") rotate(" + (rot || 0) + "deg)";
        if (op !== undefined) el.style.opacity = op;
      }
      var dusts = [];
      function dust(x, y) {
        for (var i = 0; i < 6; i++) {
          var d = document.createElement("div"); d.className = "dust"; L.insertBefore(d, title);
          dusts.push({ el: d, x: x, y: y, vx: (Math.random() - .5) * 160, vy: -40 - Math.random() * 60, t: 0 });
        }
      }
      var landed = [false, false];
      function frame(now) {
        var t = hold >= 0 ? hold : still ? ANIM : now - t0;
        var W = L.clientWidth, H = L.clientHeight;
        // gökyüzü ve güneş: tepenin ardından doğar
        day.style.opacity = out3(seg(t, 0, 1100));
        var S = Math.min(W * 0.44, 190), sx = W / 2, sy0 = H * 0.72, sy1 = H * 0.2;
        var rise = out3(seg(t, 0, 1000)), morph = seg(t, 2200, 2600);
        put(sun, sx, lerp(sy0, sy1, rise), S, S * 389 / 400, 1 + 0.25 * Math.sin(morph * Math.PI) - 0.6 * seg(t, 2400, 2600), t * 0.012, 1 - seg(t, 2420, 2600));
        // güneş Funday Morning logosuna dönüşür: parlama ve logo yaylanarak gelir
        var F = Math.min(W * 0.32, 124), pop = seg(t, 2380, 2750);
        put(flash, sx, sy1, S * 1.6, S * 1.6, 0.4 + 1.2 * seg(t, 2250, 2500), 0, Math.sin(seg(t, 2250, 2700) * Math.PI));
        put(fm, sx, sy1, F, F, pop > 0 ? back(pop) : 0.01, 0, clamp(pop * 4));
        // başlık: aşağıdan büyüyerek gelir
        var Lw = Math.min(W * 0.86, 400), Lh = Lw * 444 / 900, lx = W / 2, ly = H * 0.47;
        var tp = seg(t, 350, 850), land = Math.max(seg(t, 1880, 2050), seg(t, 1980, 2150));
        var squash = Math.sin(land * Math.PI) * 0.05;
        var bob = t > ANIM ? Math.sin((t - ANIM) / 380) * 4 : 0;
        put(title, lx, ly - Lh / 2 + Lh * (0.376 + 0.31) + bob, Lw, Lw * 275 / 900, tp > 0 ? back(tp) : 0.01, (1 - tp) * -8, clamp(tp * 3) * (1 - seg(t, 2150, 2400)));
        title.style.transform += " scale(" + (1 + squash) + "," + (1 - squash) + ")";
        put(logo, lx, ly + bob, Lw, Lh, 1, 0, seg(t, 2150, 2400));
        // koyun ve köpek: aşağıdan koşar, yazının üstüne atlayıp logodaki yerlerine oturur
        [[sheep, 0.42, 0.532, 0.02, 700, "sheep", -0.18], [dog, 0.40, 0.80, -0.01, 820, "dog", 0.2]].forEach(function (c, i) {
          var el = c[0], size = Lw * c[1], tx = lx - Lw / 2 + Lw * c[2], ty = ly - Lh / 2 + Lh * c[3] + size / 2;
          var start = c[4], runEnd = start + 900, jumpEnd = runEnd + 380;
          var bx = lx + W * c[6], by = ly + Lh * 0.95;   // atlama noktası: yazının altı
          var x, y, sc, rot = 0, jump = t >= runEnd;
          if (t < runEnd) {
            var k = out3(seg(t, start, runEnd));
            x = lerp(lx + W * c[6] * 1.6, bx, k); y = lerp(H + size, by, k) - Math.abs(Math.sin(t / 95)) * 14 * (1 - k * 0.5);
            sc = lerp(0.62, 0.9, k); rot = Math.sin(t / 95) * 5;
          } else {
            var j = seg(t, runEnd, jumpEnd);
            x = lerp(bx, tx, j); y = lerp(by, ty, j) - Math.sin(j * Math.PI) * Lh * 0.75; sc = lerp(0.9, 1, j);
            rot = (1 - j) * (c[6] > 0 ? -10 : 10);
            if (j >= 1 && !landed[i]) { landed[i] = true; dust(tx, ly - Lh / 2 + Lh * 0.42); }
          }
          var want = "boot/" + c[5] + (jump ? "_jump" : "_run") + ".png";
          if (el.getAttribute("src") !== want) el.setAttribute("src", want);
          put(el, x, y + bob, size, size, sc, rot, t < start ? 0 : 1 - seg(t, 2150, 2400));
        });
        for (var i = dusts.length - 1; i >= 0; i--) {
          var d = dusts[i]; d.t += 1 / 60; d.vy += 300 / 60; d.x += d.vx / 60; d.y += d.vy / 60;
          d.el.style.transform = "translate(" + d.x + "px," + d.y + "px) scale(" + (1 + d.t * 2) + ")"; d.el.style.opacity = .9 - d.t * 1.8;
          if (d.t > 0.5) { d.el.remove(); dusts.splice(i, 1); }
        }
        // yükleme çubuğu: animasyondan sonra; gerçek ilerlemeyi geçmez, en az BAR kadar sürer
        barbox.style.top = H * 0.8 + "px";
        barbox.style.opacity = seg(t, ANIM - 150, ANIM + 150);
        var want = Math.min(real, seg(t, ANIM, ANIM + BAR));
        shown += (want - shown) * 0.2;
        if (want >= 1 && shown > 0.995) shown = 1;
        fill.style.width = (shown * 100).toFixed(1) + "%";
        if (shown >= 1 && ready && !done && hold < 0) { done = true; ready(); return; }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      return {
        progress: function (p) { real = Math.max(real, p * 0.98); },
        finish: function (cb) { real = 1; ready = cb; },
      };
    })();

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Funday Morning",
      productName: "Herd-In!",
      productVersion: "0.3.0",
      // Telefonlarda çözünürlük 2x ile sınırlı: pil ve ısınma için.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === "error") showError(msg); },
    };

    // Açıldıktan sonraki sorunlar: yükleme ekranı kalktığı için ayrı bir katmanda gösterilir.
    function showHalt(why) {
      var h = document.querySelector("#halt");
      if (h.style.display === "flex") return;
      document.querySelector("#halt-msg").textContent = tr ? "Oyun takıldı. Yeniden yükleyince kaldığın yerden devam edersin." : "The game got stuck. Reload to continue where you left off.";
      document.querySelector("#halt-btn").textContent = tr ? "Yeniden yükle" : "Reload";
      document.querySelector("#halt-why").textContent = why || "";
      h.style.display = "flex";
    }
    document.querySelector("#halt-btn").onclick = function () { location.reload(); };
    canvas.addEventListener("webglcontextlost", function () { showHalt("webglcontextlost"); });

    // Dokunma yedeği: her dokunuş oyuna SendMessage ile de iletilir (Game/TouchBridge.cs). Unity dokunuşu kendisi aldıysa
    // yedek kullanılmaz; bazı iPhone Safari'lerde Unity'nin kendi dokunma girdisi oyuna ulaşmıyor.
    var lastMove = 0;
    function touch(phase, e) {
      var t = e.changedTouches && e.changedTouches[0];
      if (!window.unityInstance || !t) return;
      if (phase === "m") { var now = Date.now(); if (now - lastMove < 30) return; lastMove = now; }
      var r = canvas.getBoundingClientRect();
      if (phase === "d" && (t.clientX < r.left || t.clientX > r.right || t.clientY < r.top || t.clientY > r.bottom)) return;
      var x = (t.clientX - r.left) * canvas.width / r.width, y = (t.clientY - r.top) * canvas.height / r.height;
      try { window.unityInstance.SendMessage("HerdIn", "WebTouch", phase + " " + x.toFixed(1) + " " + y.toFixed(1)); } catch (err) { lastError = String(err); }
    }
    var opt = { capture: true, passive: true };
    window.addEventListener("touchstart", function (e) { touch("d", e); }, opt);
    window.addEventListener("touchmove", function (e) { touch("m", e); }, opt);
    window.addEventListener("touchend", function (e) { touch("u", e); }, opt);
    window.addEventListener("touchcancel", function (e) { touch("u", e); }, opt);

    function showError(msg) {
      if (window.unityInstance) { showHalt(String(msg).slice(0, 300)); return; }
      var e = document.querySelector("#error");
      e.textContent = (tr ? "Oyun açılamadı: " : "Could not start the game: ") + msg;
      e.style.display = "block";
      document.querySelector("#barbox").style.display = "none";
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, boot.progress).then(function (inst) {
        window.unityInstance = inst;
        boot.finish(function () {
        var l = document.querySelector("#loading");
        l.style.opacity = "0";
        setTimeout(function () { l.remove(); }, 500);
        canvas.focus();
        lastFrame = Date.now();
        setInterval(function () {
          if (document.visibilityState === "visible" && Date.now() - lastFrame > 10000) showHalt(lastError || "no frames");
          else if (document.visibilityState !== "visible") lastFrame = Date.now();
        }, 1000);
        });
      }).catch(showError);
    };
    script.onerror = function () { showError(tr ? "dosyalar yüklenemedi." : "files failed to load."); };
    document.body.appendChild(script);
  </script>
</body>
</html>
